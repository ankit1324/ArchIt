  const bg = e.target.closest('.blk');
  const {ox, oy} = planOff;
  const r = stage.getBoundingClientRect();
  if(hg){
    const b = getBlock(+hg.dataset.blk);
    const [w,d] = footprint(b);
    drag2 = {kind:'resize', b, sx:+hg.dataset.sx, sz:+hg.dataset.sz,
      L0:b.cx-w/2, R0:b.cx+w/2, T0:b.cz-d/2, B0:b.cz+d/2,
      cx0:b.cx, cz0:b.cz, len0:b.len, w0:b.w,
      ox, oy, snap:snapshot(), moved:false};
  } else if(dg){
    const b = getBlock(+dg.dataset.blk);
    const d = b.doors.find(x=>x.id===+dg.dataset.door);
    drag2 = {kind:'door', b, o:d, ox, oy, snap:snapshot(), moved:false, w0:d.wall, t0:d.t};
  } else if(wg){
    const b = getBlock(+wg.dataset.blk);
    const o = b.windows.find(x=>x.id===+wg.dataset.win);
    drag2 = {kind:'win', b, o, ox, oy, snap:snapshot(), moved:false, w0:o.wall, t0:o.t};
  } else if(pg){
    const b = getBlock(+pg.dataset.blk);
    const o = b.partitions.find(x=>x.id===+pg.dataset.part);
    drag2 = {kind:'part', b, o, ox, oy, snap:snapshot(), moved:false, t0:o.t};
  } else if(fg2){
    const b = getBlock(+fg2.dataset.blk);
    const o = b.furniture.find(x=>x.id===+fg2.dataset.furn);
    drag2 = {kind:'furn', b, o, ox, oy, snap:snapshot(), moved:false, x0f:o.lx, z0f:o.lz};
  } else if(bg){
    const b = getBlock(+bg.dataset.id);
    const wx = (e.clientX-r.left-ox)/S, wz = (e.clientY-r.top-oy)/S;
    drag2 = {kind:'block', b, offX:wx-b.cx, offZ:wz-b.cz, sx:b.cx, sz:b.cz, ox, oy, snap:snapshot(), moved:false};
  }
  if(drag2){
    drag2.x0 = e.clientX; drag2.y0 = e.clientY;
    planSvg.setPointerCapture(e.pointerId);
  }
});
planSvg.addEventListener('pointermove', e=>{
  if(!drag2) return;
  const dx = e.clientX-drag2.x0, dy = e.clientY-drag2.y0;
  if(!drag2.moved && dx*dx+dy*dy < 16) return;
  drag2.moved = true;
  const r = stage.getBoundingClientRect();
  const wx = (e.clientX-r.left-drag2.ox)/S, wz = (e.clientY-r.top-drag2.oy)/S;
  if(drag2.kind==='block'){
    const b = drag2.b;
    const [cx,cz] = snapBlock(b, wx-drag2.offX, wz-drag2.offZ);
    b.cx = cx; b.cz = cz;
  } else if(drag2.kind==='resize'){
    const b = drag2.b, mn = C.roomMin, mx = C.roomMax;
    let L = drag2.L0, R = drag2.R0, T = drag2.T0, B = drag2.B0;
    if(drag2.sx<0) L = Math.min(R-mn, Math.max(R-mx, wx));
    if(drag2.sx>0) R = Math.max(L+mn, Math.min(L+mx, wx));
    if(drag2.sz<0) T = Math.min(B-mn, Math.max(B-mx, wz));
    if(drag2.sz>0) B = Math.max(T+mn, Math.min(T+mx, wz));
    const rw = Math.round((R-L)*10)/10, rd = Math.round((B-T)*10)/10;  // snap 0.1 m
    if(drag2.sx<0) L = R-rw; else R = L+rw;
    if(drag2.sz<0) T = B-rd; else B = T+rd;
    b.cx = (L+R)/2; b.cz = (T+B)/2;
    if(b.rot%2){ b.w = rw; b.len = rd; } else { b.len = rw; b.w = rd; }
  } else if(drag2.kind==='part'){
    const b = drag2.b;
    const [lx] = worldToLocal(b, wx, wz);
    drag2.o.t = Math.min(.92, Math.max(.08, lx/b.len + .5));
  } else if(drag2.kind==='furn'){
    const b = drag2.b, o = drag2.o;
    const [lx, lz] = worldToLocal(b, wx, wz);
    o.lx = lx; o.lz = lz; clampFurn(b, o);
  } else {
    const b = drag2.b, o = drag2.o;
    const [lx,lz] = worldToLocal(b, wx, wz);
    const cand = nearestWallT(b, lx, lz, drag2.kind==='door' ? o.w : 1.2);
    o.wall = cand.wall; o.t = cand.t;
  }
  render2D();
});
planSvg.addEventListener('pointercancel', ()=>{ if(drag2){ drag2 = null; renderAll(); } });
planSvg.addEventListener('pointerup', ()=>{
  if(!drag2) return;
  const d2 = drag2;
  drag2 = null;
  if(!d2.moved){
    // pointer capture retargets the click to the svg root, so the per-element
    // click handlers never fire — select here instead
    justDragged2 = true; setTimeout(()=>justDragged2 = false, 0);
    if(d2.kind==='door') sel = {kind:'door', blockId:d2.b.id, doorId:d2.o.id};
    else if(d2.kind==='win') sel = {kind:'window', blockId:d2.b.id, winId:d2.o.id};
    else if(d2.kind==='furn') sel = {kind:'furn', blockId:d2.b.id, furnId:d2.o.id};
    else sel = {kind:'block', blockId:d2.b.id};
    renderAll();
    return;
  }
  if(d2.moved){
    justDragged2 = true; setTimeout(()=>justDragged2 = false, 0);
    let changed = true;
    if(d2.kind==='block'){
      const [w,d] = footprint(d2.b);
      if(overlaps(d2.b.cx, d2.b.cz, w, d, d2.b.id)){
        d2.b.cx = d2.sx; d2.b.cz = d2.sz;
        toast('Rooms can’t overlap');
        changed = false;
      } else changed = (d2.b.cx!==d2.sx || d2.b.cz!==d2.sz);
    } else if(d2.kind==='resize'){
      const b = d2.b, [w,d] = footprint(b);
      if(overlaps(b.cx, b.cz, w, d, b.id)){
        b.cx = d2.cx0; b.cz = d2.cz0; b.len = d2.len0; b.w = d2.w0;
        toast('Rooms can’t overlap');
        changed = false;
      } else changed = b.len!==d2.len0 || b.w!==d2.w0 || b.cx!==d2.cx0 || b.cz!==d2.cz0;
    } else if(d2.kind==='part'){
      changed = Math.abs(d2.o.t-d2.t0) > 0.004;
    } else if(d2.kind==='furn'){
      changed = d2.o.lx!==d2.x0f || d2.o.lz!==d2.z0f;
    } else {
      changed = d2.o.wall!==d2.w0 || Math.abs(d2.o.t-d2.t0) > 0.004;
    }
    if(changed && d2.kind==='door'){
      const nowShared = !!sharedWall(d2.b, d2.o.wall);
      const wasExt = d2.o.type.startsWith('ext');
      if(nowShared && wasExt) d2.o.type = 'int_hard';
      if(!nowShared && !wasExt) d2.o.type = 'ext_hard';
    }
    if(changed){ undoStack.push(d2.snap); redoStack.length = 0; }
    renderAll();
  }
});
function chip2D(x,y,label,color,vert){
  const w = label.length*6.4+18;
  const t = vert ? ` transform="rotate(-90 ${x} ${y})"` : '';
  return `<g${t}><rect x="${x-(vert?w/2:0)}" y="${y}" width="${w}" height="18" rx="9" fill="${color}"/>
    <text class="dimchip" x="${x-(vert?w/2:0)+w/2}" y="${y+12.5}" text-anchor="middle">${label}</text></g>`;
}
function openSeg2D(b, wall, t, len, ox, oy){
  const L = wallLen(b,wall), dir = wallDir(wall);
  const [cx,cz] = wallPoint(b, wall, t);
  const h = len/2;
  const [ax,az] = localToWorld(b, cx-dir[0]*h, cz-dir[1]*h);
  const [bx,bz] = localToWorld(b, cx+dir[0]*h, cz+dir[1]*h);
  const [x1,y1] = P(ax,az,ox,oy), [x2,y2] = P(bx,bz,ox,oy);
  return [x1,y1,x2,y2];
}
function wallLines2D(b, ox, oy, col){
  let out = '';
  for(let wall=0; wall<4; wall++){
    const L = wallLen(b, wall);
    // collect gaps (doors) on this wall
    const gaps = b.doors.filter(d=>d.wall===wall)
      .map(d=>[Math.max(0,d.t-(d.w/2)/L), Math.min(1,d.t+(d.w/2)/L)])
      .sort((a,b2)=>a[0]-b2[0]);
    let segs = [], cur = 0;
    gaps.forEach(([g0,g1])=>{ if(g0>cur) segs.push([cur,g0]); cur = Math.max(cur,g1); });
    if(cur<1) segs.push([cur,1]);
    segs.forEach(([t0,t1])=>{
      const dir = wallDir(wall);
      const [sx,sz] = wallPoint(b, wall, t0), [ex,ez] = wallPoint(b, wall, t1);
      const [wx1,wz1] = localToWorld(b, sx, sz), [wx2,wz2] = localToWorld(b, ex, ez);
      const [x1,y1] = P(wx1,wz1,ox,oy), [x2,y2] = P(wx2,wz2,ox,oy);
      out += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="3.5" stroke-linecap="square"/>`;
    });
  }
  return out;
}
function door2D(b, d, ox, oy, col){
  const L = wallLen(b, d.wall), dir = wallDir(d.wall);
  const [cx,cz] = wallPoint(b, d.wall, d.t);
  const hw = d.w/2;
  // hinge at one end of the gap (d.flip mirrors it), leaf swings inward (d.out reverses)
  const hs = d.flip ? 1 : -1;
  const hingeL = [cx + dir[0]*hw*hs, cz + dir[1]*hw*hs];
  let inward = d.wall===0 ? [0,-1] : d.wall===2 ? [0,1] : d.wall===1 ? [-1,0] : [1,0];
  if(d.out) inward = [-inward[0], -inward[1]];
  const tip = [hingeL[0] + inward[0]*d.w, hingeL[1] + inward[1]*d.w];
  const [h1x,h1z] = localToWorld(b, hingeL[0], hingeL[1]);
  const [t1x,t1z] = localToWorld(b, tip[0], tip[1]);
  const [e1x,e1z] = localToWorld(b, cx-dir[0]*hw*hs, cz-dir[1]*hw*hs);
  const [px1,py1] = P(h1x,h1z,ox,oy), [px2,py2] = P(t1x,t1z,ox,oy), [px3,py3] = P(e1x,e1z,ox,oy);
  return `<g data-door="${d.id}" data-blk="${b.id}" style="cursor:grab">
    <line x1="${px1}" y1="${py1}" x2="${px2}" y2="${py2}" stroke="${col}" stroke-width="2.5"/>
    <path d="M ${px2} ${py2} A ${d.w*S} ${d.w*S} 0 0 ${arcSweep(px1,py1,px2,py2,px3,py3)} ${px3} ${py3}" fill="none" stroke="${col}" stroke-width="1.4" stroke-dasharray="1 4"/>
    <line x1="${px1}" y1="${py1}" x2="${px3}" y2="${py3}" stroke="transparent" stroke-width="18"/>
    <circle cx="${(px1+px3)/2}" cy="${(py1+py3)/2}" r="12" fill="transparent"/>
  </g>`;
}
function arcSweep(hx,hy,tx,ty,ex,ey){
  const cross = (tx-hx)*(ey-hy)-(ty-hy)*(ex-hx);
  return cross>0 ? 1 : 0;
}

function placeDoorByClick(blockId, e){
  const b = getBlock(blockId);
  const r = stage.getBoundingClientRect();
  const bb = boundsOf(state.blocks);
  const ox = r.width/2-bb.cx*S, oy = r.height/2-bb.cz*S;
  const wx = (e.clientX-r.left-ox)/S, wz = (e.clientY-r.top-oy)/S;
  // to local
  const a = b.rot*Math.PI/2;
  const lx = (wx-b.cx)*Math.cos(a) - (wz-b.cz)*Math.sin(a);
  const lz = (wx-b.cx)*Math.sin(a) + (wz-b.cz)*Math.cos(a);
  // nearest wall
  const cand = [
    {wall:0, dist:Math.abs(lz-b.w/2), t:(lx/b.len)+.5},
    {wall:2, dist:Math.abs(lz+b.w/2), t:.5-(lx/b.len)},
    {wall:1, dist:Math.abs(lx-b.len/2), t:.5-(lz/b.w)},
    {wall:3, dist:Math.abs(lx+b.len/2), t:(lz/b.w)+.5},
  ].sort((p,q)=>p.dist-q.dist)[0];
  const t = Math.min(.88, Math.max(.12, cand.t));
  commit(()=>{
    const type = sharedWall(b, cand.wall) ? 'int_hard' : (ui.pendingDoorType||'ext_hard');
    const d = {id:++state.seq.door, wall:cand.wall, t, type,
      w: type==='ext_glass' ? 1.6 : 0.8, h:2.0, color:'blue'};
    b.doors.push(d);
    sel = {kind:'door', blockId:b.id, doorId:d.id};
    ui.tool = null;
  });
}

/* ============================== chips actions ============================== */
chips.addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  const b = selBlock(); if(!b) return;
  const a = btn.dataset.a;
  if(sel.kind==='furn'){
    const f = selFurn(); if(!f) return;
    if(a==='rot') commit(()=>{ f.rot = (f.rot+1)%4; clampFurn(b, f); });
    if(a==='del') commit(()=>{ b.furniture = b.furniture.filter(x=>x.id!==f.id); sel = {kind:'block', blockId:b.id}; });
    if(a==='dup') commit(()=>{
      const nf = Object.assign({}, f, {id:++state.seq.furn, lx:f.lx+.3, lz:f.lz+.3});
      clampFurn(b, nf); b.furniture.push(nf); sel = {kind:'furn', blockId:b.id, furnId:nf.id};
    });
    return;
  }
  if(a==='dup'){
    const [w,d] = footprint(b);
    const spots = [[0,1],[1,0],[0,-1],[-1,0]];
    const spot = spots.find(([sx,sz])=>!overlaps(b.cx+sx*(w+0.02), b.cz+sz*(d+0.02), w, d));
    if(!spot){ toast('No free side to duplicate to'); return; }
    commit(()=>{
      const nb = JSON.parse(JSON.stringify(b));
      nb.id = ++state.seq.block;
      nb.cx = b.cx+spot[0]*(w+0.02); nb.cz = b.cz+spot[1]*(d+0.02);
      nb.doors.forEach(dd=>dd.id = ++state.seq.door);
      nb.windows.forEach(ww=>ww.id = ++state.seq.win);
      nb.partitions.forEach(pp=>pp.id = ++state.seq.part);
      nb.furniture.forEach(ff=>ff.id = ++state.seq.furn);
      state.blocks.push(nb);
      sel = {kind:'block', blockId:nb.id};
    });
  }
  if(a==='rot'){
    commit(()=>{ b.rot = (b.rot+1)%4; });
  }
  if(a==='del'){
    if(state.blocks.length===1){ toast('The house needs at least one room'); return; }
    commit(()=>{
      state.blocks = state.blocks.filter(x=>x.id!==b.id);
      sel = null;
    });
  }
});

function optionsFrom(map, cur){
  return Object.entries(map).map(([k,v])=>`
    <button class="sel-item" data-v="${k}">
      ${v.hex?`<span class="dot" style="background:${v.hex}"></span>`:''}
      <span><span class="nm">${v.name}</span></span>
      ${k===cur?'<svg style="margin-left:auto;color:#1d5bb4" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 13 4 4L19 7"/></svg>':''}
    </button>`).join('');
}
function curLabel(map, k){
  const v = map[k];
  return `${v.hex?`<span class="dot" style="background:${v.hex}"></span>`:''}<span>${v.name}</span>`;
}
function defOptions(map, cur){
  const def = `<button class="sel-item" data-v="_def">
    <span class="dot" style="background:#fff"></span><span><span class="nm">Default</span></span>
    ${cur==null?'<svg style="margin-left:auto;color:#1d5bb4" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="m5 13 4 4L19 7"/></svg>':''}
  </button>`;
  return def + optionsFrom(map, cur);
}
function roomColLabel(map, cur, defName){
  return cur ? curLabel(map, cur) : `<span class="dot" style="background:#fff"></span><span>${defName}</span>`;
}
function stdSelect(id, map, key, onPick){
  SEL_H[id] = v=>commit(()=>{ state[key]=v; onPick&&onPick(v); });
  return selectHTML(id, optionsFrom(map, state[key]), curLabel(map, state[key]));
}
function applyModernPreset(key){
  const preset = MODERN_PRESETS[key];
  if(!preset) return;
  commit(()=>{
    Object.assign(state, {
      paint:preset.paint,
      facade:preset.facade,
      facadeMat:preset.facadeMat,
      roofStyle:preset.roofStyle,
      roofCol:preset.roofCol,
    });
    ensureExteriorState();
  });
}
function modernPresetButtons(){
  return '<div class="f-label">Modern presets</div><div class="preset-grid">'+
    Object.entries(MODERN_PRESETS).map(([key,preset])=>
      '<button type="button" class="preset-btn" data-preset="'+key+'">'+preset.name+'</button>'
    ).join('')+'</div>';
}

function renderSidebar(){
  if(!state){ side.innerHTML=''; return; }
  const b = selBlock();
  if(b && sel.kind==='block') return renderBlockPanel(b);
  if(b && sel.kind==='door')  return renderDoorPanel(b, selDoor());
  if(b && sel.kind==='furn')  return renderFurnPanel(b, selFurn());
  if(b && sel.kind==='window') return renderWinPanel(b, selWin());

  const bb = state.blocks.length ? boundsOf(state.blocks) : {w:0,d:0};
  const secs = [
    ['exterior','Exterior', ()=>modernPresetButtons()+`
      <div class="f-label">Facade material</div>${stdSelect('facadeMat', C.facadeMat, 'facadeMat')}
      <div class="f-label">Facade colour</div>${stdSelect('facade', C.facade, 'facade')}
      <div class="f-label">Roof style</div>${stdSelect('roofStyle', C.roofStyle, 'roofStyle')}
      <div class="f-label">Roof colour</div>${stdSelect('roofCol', C.roofCol, 'roofCol')}`],
    ['interior','Interior', ()=>`
      <div class="f-label">Wall paint (house default)</div>
      ${stdSelect('paint', C.paint, 'paint')}
      <div class="note"><svg width="14" height="14" style="flex:none" viewBox="0 0 24 24" fill="none" stroke="#8b96ab" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>
      Rooms without their own colour use this paint</div>`],
    ['windows','Windows', ()=>{
      let rows = '';
      state.blocks.forEach((bl,i)=>bl.windows.forEach((w,j)=>{
        rows += `<div class="optrow"><span class="nm">Window ${j+1} · ${(bl.name||C.rooms[bl.type].name).toLowerCase()} ${i+1}</span>

      }));

    ['doors','Doors', ()=>{
      let rows = '';
      state.blocks.forEach((bl,i)=>bl.doors.forEach((d,j)=>{
        rows += `<button class="itemrow" data-act="seldoor" data-b="${bl.id}" data-d="${d.id}">

      }));

    ['furniture','Furniture', ()=>{

      state.blocks.forEach((bl,i)=>(bl.furniture||[]).forEach(f=>{
        rows += `<div class="optrow"><span class="nm">${C.furniture[f.key].name}
          <span style="display:block;font-size:11.5px;color:#8b96ab;font-weight:600">${bl.name||C.rooms[bl.type].name+" "+(i+1)}</span></span>

      return (rows || `<div class="note">Select a room, then add furniture from the toolbar catalog.</div>`);
    }],

  let area = 0; state.blocks.forEach(bl=>area += bl.w*bl.len);
  side.innerHTML = `

/* sidebar event delegation */
side.addEventListener('click', e=>{
  const secBtn = e.target.closest('.sec > button');
  if(secBtn){
    const id = secBtn.parentElement.dataset.sec;
    ui.openSecs.has(id) ? ui.openSecs.delete(id) : ui.openSecs.add(id);
    renderSidebar(); return;
  }
  const selBtn = e.target.closest('.sel-btn');
  if(selBtn){
    const wrap = selBtn.closest('.sel');
    document.querySelectorAll('.sel.open').forEach(s=>s!==wrap&&s.classList.remove('open'));
    wrap.classList.toggle('open'); return;
  }
  const preset = e.target.closest('[data-preset]');
  if(preset){
    applyModernPreset(preset.dataset.preset);
    return;
  }
  const item = e.target.closest('.sel-item');
  if(item){
    const wrap = item.closest('.sel');
    const h = SEL_H[wrap.dataset.sel];
    wrap.classList.remove('open');
    h && h(item.dataset.v); return;
  }
  const act = e.target.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a==='close'){ sel = null; renderAll(); }
  if(a==='deldoor'){
    const b = selBlock(), d = selDoor(); if(!b||!d) return;
    commit(()=>{ b.doors = b.doors.filter(x=>x.id!==d.id); sel = {kind:'block', blockId:b.id}; });
  }
  if(a==='delfurn'){
    const b = getBlock(+act.dataset.b);
    commit(()=>{ b.furniture = b.furniture.filter(f=>f.id!==+act.dataset.f); if(sel&&sel.kind==='furn'&&sel.furnId===+act.dataset.f) sel=null; });
  }
  if(a==='addwin'){
    const b = selBlock() || state.blocks[0]; if(!b) return;
    commit(()=>{
      const t = freeT([...b.windows.filter(w=>w.wall===0), ...b.doors.filter(d=>d.wall===0)], b.len, 1.5);
      b.windows.push({id:++state.seq.win, wall:0, t});
    });
  }
  if(a==='delwin'){
    const b = getBlock(+act.dataset.b);
    commit(()=>{ b.windows = b.windows.filter(w=>w.id!==+act.dataset.w);
      if(sel&&sel.kind==='window'&&sel.winId===+act.dataset.w) sel=null; });
  }
  if(a==='seldoor'){ sel = {kind:'door', blockId:+act.dataset.b, doorId:+act.dataset.d}; renderAll(); }
  if(a==='opendoors'){ openToolPop('doors'); }
  if(a==='flipdoor'){ const d = selDoor(); if(d) commit(()=>{ d.flip = !d.flip || undefined; }); }
  if(a==='swingdoor'){ const d = selDoor(); if(d) commit(()=>{ d.out = !d.out || undefined; }); }
});
side.addEventListener('change', e=>{
  const el = e.target;
  if(el.dataset.act==='rname'){
    const b = selBlock(); if(!b) return;
    commit(()=>{ b.name = el.value.trim() || undefined; });
    return;
  }
  if(el.dataset.act==='dw'||el.dataset.act==='dh'){
    const d = selDoor(); if(!d) return;
    const v = Math.max(+el.min, Math.min(+el.max, +el.value||0));
    commit(()=>{ d[el.dataset.act==='dw'?'w':'h'] = v/100; });
  }
  if(el.dataset.act==='rw'||el.dataset.act==='rl'){
    const b = selBlock(); if(!b) return;
    const v = Math.round(Math.max(C.roomMin, Math.min(C.roomMax, +el.value||0))*10)/10;
    const nw = el.dataset.act==='rw' ? v : b.w;
    const nl = el.dataset.act==='rl' ? v : b.len;
    const [fw, fd] = b.rot%2 ? [nw, nl] : [nl, nw];
    if(overlaps(b.cx, b.cz, fw, fd, b.id)){
      toast('No space — the room would overlap a neighbour');
      renderSidebar();
      return;
    }
    commit(()=>{ b.w = nw; b.len = nl; });
    return;
  }
});
document.addEventListener('click', e=>{
  if(!e.target.closest('.sel')) document.querySelectorAll('.sel.open').forEach(s=>s.classList.remove('open'));
  if(!e.target.closest('.dropdown')) document.querySelectorAll('.dropdown.open').forEach(s=>s.classList.remove('open'));
});

/* ===== furniture catalog: live thumbnails + category browser ===== */
const FURN_CATS = [['all','All'],['living','Living'],['bedroom','Bedroom'],['kitchen','Kitchen'],['bath','Bath'],['office','Office']];
let furnCat = 'all', furnQuery = '';
let _thumbR, _thumbScene, _thumbCam;
const _thumbCache = {};
// Render a small 3D preview of a furniture model once, cache as a data URL.
function furnThumb(key){
  if(_thumbCache[key]) return _thumbCache[key];
  if(!_thumbR){
    _thumbR = new THREE.WebGLRenderer({antialias:true, alpha:true});
    _thumbR.setSize(120,120); _thumbR.setPixelRatio(2);
    _thumbScene = new THREE.Scene();
    _thumbScene.add(new THREE.HemisphereLight('#ffffff','#c8ccd2',1.25));
    const dl = new THREE.DirectionalLight('#ffffff',1.35); dl.position.set(3,6,4); _thumbScene.add(dl);
    _thumbCam = new THREE.PerspectiveCamera(38,1,.05,100);
  }
  const M = FURN_MATS();
  const g = FURN_BUILDERS[key] ? FURN_BUILDERS[key](M) : legacyBuildFurn({key,lx:0,lz:0,rot:0,id:0});
  _thumbScene.add(g);
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const rad = Math.max(size.x,size.y,size.z)*0.72 + 0.3;
  _thumbCam.position.set(c.x + rad*1.05, c.y + rad*0.95, c.z + rad*1.35);
  _thumbCam.lookAt(c.x, c.y*0.92, c.z);
  _thumbR.render(_thumbScene, _thumbCam);
  const url = _thumbR.domElement.toDataURL('image/webp', 0.82);
  _thumbScene.remove(g);
  return (_thumbCache[key] = url);
}
function furnGridHTML(){
  const q = furnQuery.trim().toLowerCase();
  const items = Object.entries(C.furniture).filter(([k,v]) =>
    (furnCat === 'all' || v.cat === furnCat) && (!q || v.name.toLowerCase().includes(q)));
  if(!items.length) return `<div class="note" style="grid-column:1/-1">No matching furniture</div>`;
  return items.map(([k,v]) =>
    `<button class="fitem" draggable="true" data-add-furn="${k}" data-furnkey="${k}" title="${v.name} · ${v.w} × ${v.d} m">
      <img class="fthumb" src="${furnThumb(k)}" alt="" draggable="false">
      <span class="fnm">${v.name}</span></button>`).join('');
}
function furnCatalogHTML(X){
  const tabs = FURN_CATS.map(([k,n]) => `<button class="fcat${k===furnCat?' on':''}" data-fcat="${k}">${n}</button>`).join('');
  return `<h3>Furniture ${X}</h3>
    <input class="fsearch" placeholder="Search furniture…" value="${furnQuery}">
    <div class="fcats">${tabs}</div>
    <div class="fgrid">${furnGridHTML()}</div>`;
}
function refreshFurnGrid(){ const grid = toolpop.querySelector('.fgrid'); if(grid) grid.innerHTML = furnGridHTML(); }

function openToolPop(tool){
  ui.tool = null;
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.toggle('on', b.dataset.t===tool));
  let html = '';
  const X = `<button class="x" data-close><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
  if(tool==='blocks'){
    html = `<h3>Rooms ${X}</h3>` + Object.entries(C.rooms).map(([k,v])=>`
      <button class="itemrow" data-add-room="${k}">
        <span class="ic">${ICONS.gen}</span>
        <span><span class="nm">${v.name}</span>
        <span style="display:block;font-size:11.5px;color:#8b96ab">${v.w} × ${v.len} m</span></span>
      </button>`).join('');
  } else if(tool==='doors'){
    const groups = {};
    Object.entries(C.doors).forEach(([k,v])=>{ (groups[v.grp] = groups[v.grp]||[]).push([k,v]); });
    html = `<h3>Doors ${X}</h3>` + Object.entries(groups).map(([g,items])=>
      `<div class="grp">${g}</div>` + items.map(([k,v])=>`
        <button class="itemrow" data-add-door="${k}">
          <span class="ic">${ICONS.door}</span>
          <span><span class="nm">${v.name}</span></span>
        </button>`).join('')).join('');
  } else if(tool==='partitions'){
    html = `<h3>Partitions ${X}</h3>
      <button class="itemrow" data-add-part><span class="ic">${ICONS.gen}</span>
      <span><span class="nm">Interior partition</span></span></button>`;
  } else if(tool==='furniture'){
    html = furnCatalogHTML(X);
  }
  toolpop.innerHTML = html;
  toolpop.classList.toggle('furni', tool==='furniture');
  toolpop.classList.add('show');
}
function closeToolPop(){
  toolpop.classList.remove('show');
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('on'));
}
document.getElementById('toolbar').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  // Templates opens the picker, not a tool popup. Starting a template replaces
  // the current layout, so confirm first when there is work to lose.
  if(b.dataset.action === 'templates'){
    closeToolPop();
    const placed = (state.floors || [{blocks: state.blocks}]).flatMap(f=>f.blocks).length;
    if(placed && !confirm('Start a new project from a template? Your current layout will be replaced.')) return;
    showTemplatePicker();
    return;
  }
  if(b.classList.contains('on')) closeToolPop();
  else openToolPop(b.dataset.t);
});

toolpop.addEventListener('dragstart', e=>{
  const item = e.target.closest('[data-furnkey]');

  e.dataTransfer.setData('text/furnkey', item.dataset.furnkey);

canvas.addEventListener('dragover', e=>{
  if([...e.dataTransfer.types].includes('text/furnkey')){ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; }
});
canvas.addEventListener('drop', e=>{
  const key = e.dataTransfer.getData('text/furnkey');
  if(!key || !C.furniture[key]) return;
  e.preventDefault();
  closeToolPop();
  if(ui.view === '2d'){ toast('Switch to 3D to drop furniture'); return; }
  const hits = rayFrom(e).intersectObjects(blocksRoot.children, true);
  const hit = hits.find(h => h.object.userData.pick && h.object.userData.pick.blockId != null);
  const b = hit ? getBlock(hit.object.userData.pick.blockId)
                : (state.blocks.length === 1 ? state.blocks[0] : selBlock());
  if(!b){ toast('Drop onto a room'); return; }
  const f = {id:++state.seq.furn, key, lx:0, lz:0, rot:0};
  if(hit){  // world hit point -> the room's local coordinates
    const a = b.rot*Math.PI/2, dx = hit.point.x - b.cx, dz = hit.point.z - b.cz;
    f.lx = dx*Math.cos(a) - dz*Math.sin(a);
    f.lz = dx*Math.sin(a) + dz*Math.cos(a);
  }
  if(!clampFurn(b, f)){ toast('The room is too small for that'); return; }
  commit(()=>{ b.furniture.push(f); sel = {kind:'furn', blockId:b.id, furnId:f.id}; });
});
toolpop.addEventListener('click', e=>{
  if(e.target.closest('[data-close]')){ closeToolPop(); return; }
  const fcat = e.target.closest('[data-fcat]');
  if(fcat){
    furnCat = fcat.dataset.fcat;
    toolpop.querySelectorAll('.fcat').forEach(c=>c.classList.toggle('on', c.dataset.fcat===furnCat));
    refreshFurnGrid();
    return;
  }
  const addRoom = e.target.closest('[data-add-room]');
  if(addRoom){
    const type = addRoom.dataset.addRoom;
    const ref = selBlock() || state.blocks[state.blocks.length-1];
    const [rw, rd] = footprint(ref);
    const spec = C.rooms[type];
    const [nw, nd] = ref.rot%2 ? [spec.w, spec.len] : [spec.len, spec.w];
    const spot = [[0,1],[1,0],[0,-1],[-1,0]].find(([sx,sz])=>
      !overlaps(ref.cx+sx*((rw+nw)/2+.02), ref.cz+sz*((rd+nd)/2+.02), nw, nd));
    if(!spot){ toast('No free side to add a room'); return; }
    commit(()=>{
      const nb = newRoom(type, ref.cx+spot[0]*((rw+nw)/2+.02), ref.cz+spot[1]*((rd+nd)/2+.02), ref.rot);
      state.blocks.push(nb); sel = {kind:'block', blockId:nb.id};
    });
    closeToolPop(); return;
  }
  const addDoor = e.target.closest('[data-add-door]');
  if(addDoor){
    const type = addDoor.dataset.addDoor;
    if(ui.view==='2d'){
      ui.pendingDoorType = type; ui.tool = 'door-place';
      closeToolPop();
      toast('Click a wall on the plan to place the door');
      return;
    }
    const b = selBlock() || state.blocks[0];
    commit(()=>{
      const wall = 0;
      const t = freeT([...b.doors.filter(d=>d.wall===wall), ...b.windows.filter(w=>w.wall===wall)], b.len, 1.2);
      const finalType = sharedWall(b, wall) ? (type.startsWith('ext') ? 'int_hard' : type) : type;
      const d = {id:++state.seq.door, wall, t, type:finalType, w: finalType==='ext_glass' ? 1.6 : 0.8, h:2.0, color:'blue'};
      b.doors.push(d); sel = {kind:'door', blockId:b.id, doorId:d.id};
    });
    closeToolPop();
    toast('Use the right panel to choose door type and size');
    return;
  }
  const addFurn = e.target.closest('[data-add-furn]');
  if(addFurn){
    const b = selBlock() || (state.blocks.length===1 ? state.blocks[0] : null);
    if(!b){ toast('Select a room first'); return; }
    const f = {id:++state.seq.furn, key:addFurn.dataset.addFurn, lx:0, lz:0, rot:0};
    if(!clampFurn(b, f)){ toast('The room is too small for that'); return; }
    // nudge off other furniture at the exact centre
    while(b.furniture.some(o=>Math.abs(o.lx-f.lx)<.2 && Math.abs(o.lz-f.lz)<.2) && clampFurn(b, f) && f.lx < b.len/2){ f.lx += .4; }
    clampFurn(b, f);
    commit(()=>{ b.furniture.push(f); sel = {kind:'furn', blockId:b.id, furnId:f.id}; });
    return;
  }
  const addPart = e.target.closest('[data-add-part]');
  if(addPart){
    const b = selBlock() || state.blocks[0];
    commit(()=>{
      const t = freeT(b.partitions, b.len, 1.0);
      b.partitions.push({id:++state.seq.part, t});
      sel = {kind:'block', blockId:b.id};
    });
    closeToolPop(); return;
  }
});

function resetCam(){
  controls.minDistance = 4; controls.maxDistance = 40; controls.maxPolarAngle = 1.45;
  camera.position.set(10.5, 7.5, 12.5);
  controls.target.set(0, 1.1, 0);
  controls.update();
}
function enterInterior(){
  const b = getBlock(ui.focusRoomId);
  if(!b) return;
  const [w,d] = footprint(b);
  controls.minDistance = .3;
  controls.maxDistance = Math.max(w, d)*1.4 + 1;
  controls.maxPolarAngle = 1.62;
  controls.target.set(b.cx, 1.35, b.cz);
  camera.position.set(b.cx + w*.34, 1.55, b.cz + d*.34);
  controls.update();
  toggleRoofs(false);
}
// walkthrough: WASD (and arrows when nothing is selected) move through the room
document.addEventListener('keydown', e=>{
  if(!ui.interior || ui.view!=='3d') return;
  if(e.target.matches('input,textarea')) return;
  const k = e.key.toLowerCase();
  let f = 0, sd = 0;
  if(k==='w'||k==='arrowup') f = 1;
  else if(k==='s'||k==='arrowdown') f = -1;
  else if(k==='a'||k==='arrowleft') sd = -1;
  else if(k==='d'||k==='arrowright') sd = 1;
  else return;
  if(sel && k.startsWith('arrow')) return;   // arrows nudge the selection instead
  e.preventDefault();
  const dir = new THREE.Vector3(); camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
  const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
  const mv = dir.multiplyScalar(f*.22).add(right.multiplyScalar(sd*.22));
  camera.position.add(mv); controls.target.add(mv); controls.update();
});
function apply2DInterior(){   // auto-zoom plan to focused room
  const b = getBlock(ui.focusRoomId);
  if(!b) return;
  const [w,d] = footprint(b);
  const r = stage.getBoundingClientRect();
  S = Math.min(170, Math.max(16, Math.min(r.width/(w+1.6), r.height/(d+1.6))));
}
function setInterior(on){
  if(on){
    const b = selBlock() || getBlock(ui.focusRoomId) || state.blocks[0];
    if(!b) return;
    ui.interior = true;
    ui.focusRoomId = b.id;
    if(ui.view==='3d') enterInterior();
    else { apply2DInterior(); render2D(); }
  } else {
    ui.interior = false;
    resetCam();
    toggleRoofs(true);
    if(ui.view==='2d'){ S = 54; render2D(); }
    else renderHotspots();
  }
  $('#btnIn').classList.toggle('on', ui.interior);
}
function setView(v){
  ui.view = v;
  $('#btn3d').classList.toggle('on', v==='3d');
  $('#btn2d').classList.toggle('on', v==='2d');
  stage.classList.toggle('mode2d', v==='2d');
  if(v==='2d'){ chips.style.display='none'; if(ui.interior) apply2DInterior(); render2D(); }
  else { planSvg.innerHTML=''; renderHotspots(); if(ui.interior) enterInterior(); }
}

$('#floorDD .dd-menu').addEventListener('click', e=>{
  const del = e.target.closest('.fl-del');
  if(del){
    e.stopPropagation();
    const i = +del.dataset.del;
    if(state.floors.length<=1) return;
    $('#floorDD').classList.remove('open');
    commit(()=>{
      state.floors.splice(i,1);
      if(state.floor>=i) state.floor = Math.max(0, state.floor-1);
      state.blocks = state.floors[state.floor].blocks;
      sel = null;
    });
    toast(`Floor ${i+1} deleted — undo to restore`);
    return;
  }
  const btn = e.target.closest('button'); if(!btn) return;
  $('#floorDD').classList.remove('open');
  if(btn.dataset.fl==='add'){
    if(state.floors.length>=3){ toast('Up to 3 floors'); return; }
    commit(()=>{
      state.floors.push({blocks:[]});
      state.floor = state.floors.length-1;
      state.blocks = state.floors[state.floor].blocks;
      state.blocks.push(firstRoom());
      sel = null;
    });
    toast(`Floor ${state.floor+1} added`);
  } else {
    const i = +btn.dataset.fl;
    if(i===state.floor) return;
    state.floor = i;
    state.blocks = state.floors[i].blocks;
    sel = null;
    renderAll();
  }
});

function zoomCam(f){
  if(ui.view==='2d'){
    S = Math.min(170, Math.max(16, S/f));
    render2D();
    return;
  }
  const v = camera.position.clone().sub(controls.target).multiplyScalar(f);
  const len = v.length();
  if(len>controls.minDistance && len<controls.maxDistance) camera.position.copy(controls.target).add(v);
}
planSvg.addEventListener('wheel', e=>{
  if(ui.view!=='2d') return;
  e.preventDefault();
  S = Math.min(170, Math.max(16, S*(e.deltaY<0 ? 1.1 : 0.9)));
  render2D();
}, {passive:false});

/* -------- export: 3D image, 2D plan, full design sheet -------- */
function shoot3D(pos, tgt, seeThrough){
  const pc = camera.position.clone(), tc = controls.target.clone();
  const mn = controls.minDistance, mx = controls.maxDistance, mp = controls.maxPolarAngle;
  controls.minDistance = 0; controls.maxDistance = 1000; controls.maxPolarAngle = Math.PI;
  if(seeThrough) wallMats.forEach(m=>{ m.opacity = .3; m.depthWrite = false; });
  camera.position.set(pos[0], pos[1], pos[2]);
  controls.target.set(tgt[0], tgt[1], tgt[2]);
  controls.update();
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/png');
  if(seeThrough) wallMats.forEach(m=>{ m.opacity = ui.wallOpacity; m.depthWrite = ui.wallOpacity>0.9; });
  controls.minDistance = mn; controls.maxDistance = mx; controls.maxPolarAngle = mp;
  camera.position.copy(pc); controls.target.copy(tc); controls.update();
  return url;
}
function planShot(){
  const prevSel = sel, prevView = ui.view, prevInt = ui.interior;
  sel = null; ui.view = '2d'; ui.interior = false;   // export always shows the whole floor
  render2D();
  let xml = planSvg.innerHTML;
  const off = {ox:planOff.ox, oy:planOff.oy};
  sel = prevSel; ui.view = prevView; ui.interior = prevInt;
  if(prevView==='3d'){ planSvg.innerHTML = ''; renderHotspots(); }
  else render2D();
  const bb = boundsOf(state.blocks), pad = 46;
  const x = off.ox + bb.x0*S - pad, y = off.oy + bb.z0*S - pad;
  const w = bb.w*S + pad*2, h = bb.d*S + pad*2;
  // replace full-viewport background rects with ones covering the cropped viewBox
  xml = xml.replace(/<rect width="100%" height="100%"[^>]*\/>/g, '');
  xml = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#f7f9fc"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#g1)"/>` + xml;
  return {xml, x, y, w, h};
}
function planSVGDoc(p, sizeAttrs){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${p.x} ${p.y} ${p.w} ${p.h}" ${sizeAttrs}>
    <style>text{font-family:'Manrope',system-ui,sans-serif}
    .dimchip{font-size:10px;font-weight:800;fill:#fff}
    .blk-num{font-size:26px;font-weight:800;fill:#c3cbd8}
    .blk-name{font-size:13px;font-weight:700;fill:#8b96ab}</style>${p.xml}</svg>`;
}
function save3D(){
  const a = document.createElement('a');
  if(ui.view==='3d'){
    renderer.render(scene, camera);
    a.href = renderer.domElement.toDataURL('image/png');
  } else {
    const bb = boundsOf(state.blocks), R = Math.max(bb.w, bb.d)*1.15 + 5;
    a.href = shoot3D([bb.cx+R*.85, R*.7, bb.cz+R*.85], [bb.cx, .6, bb.cz], false);
  }
  a.download = 'archit-3d.png'; a.click();
}
function save2D(){
  const p = planShot();
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width = p.w*2; c.height = p.h*2;
    const g = c.getContext('2d'); g.scale(2,2); g.drawImage(img, 0, 0, p.w, p.h);
    const a = document.createElement('a');
    a.href = c.toDataURL('image/png'); a.download = 'archit-plan-2d.png'; a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(planSVGDoc(p, `width="${p.w}" height="${p.h}"`));
}
function designSheet(){
  const win = window.open('', '_blank');
  if(!win){ toast('Allow pop-ups to open the design sheet'); return; }
  const bb = boundsOf(state.blocks), R = Math.max(bb.w, bb.d)*1.15 + 5;
  const hero  = shoot3D([bb.cx+R*.85, R*.7,  bb.cz+R*.85], [bb.cx, .6, bb.cz], false);

document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if((e.metaKey||e.ctrlKey) && e.key==='z'){ e.preventDefault(); e.shiftKey? redo() : undo(); }
  if((e.metaKey||e.ctrlKey) && e.key==='y'){ e.preventDefault(); redo(); }
  if((e.key==='Delete'||e.key==='Backspace') && sel){
    e.preventDefault();
    if(sel.kind==='door'){
      const b = selBlock(), d = selDoor();
      if(b&&d) commit(()=>{ b.doors = b.doors.filter(x=>x.id!==d.id); sel = {kind:'block', blockId:b.id}; });
    } else if(sel.kind==='furn'){
      const b = selBlock(), f = selFurn();
      if(b&&f) commit(()=>{ b.furniture = b.furniture.filter(x=>x.id!==f.id); sel = {kind:'block', blockId:b.id}; });
    } else if(state.blocks.length>1){
      const b = selBlock();
      commit(()=>{ state.blocks = state.blocks.filter(x=>x.id!==b.id); sel = null; });
    }
  }
  const ARROW = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
  if(ARROW[e.key] && sel && !(ui.interior && ui.view==='3d')){
    e.preventDefault();
    const [dx,dz] = ARROW[e.key];
    const b = selBlock(); if(!b) return;
    if(sel.kind==='block'){
      const step = .1, [w,d] = footprint(b);
      if(!overlaps(b.cx+dx*step, b.cz+dz*step, w, d, b.id))
        commit(()=>{ b.cx = Math.round((b.cx+dx*step)*100)/100; b.cz = Math.round((b.cz+dz*step)*100)/100; });
    } else if(sel.kind==='furn'){
      const f = selFurn(); if(!f) return;
      const a = b.rot*Math.PI/2, ca = Math.round(Math.cos(a)), sa = Math.round(Math.sin(a));
      commit(()=>{ f.lx += (dx*ca - dz*sa)*.05; f.lz += (dx*sa + dz*ca)*.05; clampFurn(b, f); });
    }
  }
  if(e.key==='Escape'){ sel = null; ui.tool = null; closeToolPop(); renderAll(); }
});

function tutShow(i){
  tutI = i;

  let r = null;
  if(s.el){
    const el = document.querySelector(s.el) || (s.fallback && document.querySelector(s.fallback));
    if(el) r = el.getBoundingClientRect();
  }
  const p = s.pad ?? 8;
  if(r){
    tutHole.style.opacity = '1';
    tutHole.style.left = (r.left-p)+'px'; tutHole.style.top = (r.top-p)+'px';
    tutHole.style.width = (r.width+2*p)+'px'; tutHole.style.height = (r.height+2*p)+'px';
  } else {
    tutHole.style.opacity = '1';
    tutHole.style.left = '50%'; tutHole.style.top = '38%';
    tutHole.style.width = '0px'; tutHole.style.height = '0px';
  }
  tutCard.innerHTML = `
    <div class="stepn">STEP ${i+1} OF ${n}</div>
    <h4>${s.title}</h4><p>${s.body}</p>
    <div class="dots">${TUT_STEPS.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
    <div class="row">
      <button class="skip" data-tut="skip">Skip tour</button>
      <span class="nav">
        ${i>0?'<button class="back" data-tut="back">Back</button>':''}
        <button class="next" data-tut="next">${i<n-1?'Next':'Got it!'}</button>
      </span>
    </div>`;
  // place card near the hole
  const cw = 320, ch = tutCard.offsetHeight || 220, m = 16, gap = 14;
  let x, y;
  if(!r){
    x = innerWidth/2 - cw/2; y = innerHeight/2 - ch/2;
  } else {
    if(r.bottom + gap + ch + m < innerHeight){        // below
      y = r.bottom + gap + p; x = r.left + r.width/2 - cw/2;
    } else if(r.top - gap - ch - m > 0){              // above
      y = r.top - gap - ch - p; x = r.left + r.width/2 - cw/2;
    } else if(r.right + gap + cw + m < innerWidth){   // right
      x = r.right + gap + p; y = r.top + r.height/2 - ch/2;
    } else {                                          // left
      x = r.left - gap - cw - p; y = r.top + r.height/2 - ch/2;
    }
    x = Math.max(m, Math.min(innerWidth - cw - m, x));
    y = Math.max(m, Math.min(innerHeight - ch - m, y));
  }
  tutCard.style.left = x+'px'; tutCard.style.top = y+'px';
}

// Template reader. Accepts the v1 tuple form [type,cx,cz,opts] and the v2 object
// RoomSpec form (plans/02-template-v2-contract.md §2/§3). Everything past
// type/cx/cz is optional and defaults to v1 behaviour, so the already-sold paid
// templates keep building identically.
const clampRot = v => ((Number(v)||0)%4 + 4)%4;
function tRoomSpec(profile, spec){
  const type = spec.type;
  if(!C.rooms[type]){ console.warn('[builder] unknown room type in template:', type); return null; }
  const b = newRoom(type, Number(spec.cx)||0, Number(spec.cz)||0, clampRot(spec.rot));
  // §2 optional overrides — a template can finally vary size, rotation and finish
  if(spec.w   != null && isFinite(spec.w))   b.w   = Math.min(C.roomMax, Math.max(C.roomMin, Number(spec.w)));
  if(spec.len != null && isFinite(spec.len)) b.len = Math.min(C.roomMax, Math.max(C.roomMin, Number(spec.len)));
  if(spec.name) b.name = String(spec.name);
  if(spec.paint && C.paint[spec.paint]) b.paint = spec.paint;
  if(spec.floorCol && C.floorCol[spec.floorCol]) b.floorCol = spec.floorCol;
  // §4: several v1 templates pass '0'/'0.85' as strings and wallPoint uses strict
  // equality, so wall/t/size all have to be coerced with Number() right here.
  (spec.doors||[]).forEach(([wall,t,dt,dw,dh])=>b.doors.push({
    id:++state.seq.door, wall:clampRot(wall), t:Number(t)||0,
    type:(dt && C.doors[dt]) ? dt : 'int_hard',
    w: dw==null ? 0.8 : Number(dw), h: dh==null ? 2.0 : Number(dh), color:'blue'}));
  (spec.wins||[]).forEach(([wall,t,kind])=>b.windows.push({
    id:++state.seq.win, wall:clampRot(wall), t:Number(t)||0,
    kind: kind==='pano' ? 'pano' : 'std'}));
  // §2.3 explicit furniture REPLACES auto-furnish; clampFurn drops get logged, not swallowed
  if(Array.isArray(spec.furniture) && spec.furniture.length){
    spec.furniture.forEach(([key,lx,lz,rot])=>{
      if(!C.furniture[key]){ console.warn('[builder] unknown furniture key in template:', key); return; }
      const f = {id:++state.seq.furn, key, lx:Number(lx)||0, lz:Number(lz)||0, rot:clampRot(rot)};
      if(clampFurn(b, f)) b.furniture.push(f);
      else console.warn('[builder] furniture dropped, room too small:', key, 'in', type);
    });
  } else furnishRoom(b, profile);
  state.blocks.push(b);
  return b;
}
function tRoom(profile, type, cx, cz, opts={}){
  return tRoomSpec(profile, Object.assign({}, opts, {type, cx, cz}));
}
// Auto-furnish a template room so models read as lived-in homes/offices, not empty
// shells. Room footprints are fixed per type (newRoom uses the catalog w/len), so
// placements are tuned to those dims; clampFurn keeps every piece inside the walls.
function furnishRoom(b, profile){
  const office = profile === 'office';
  const put = (key, lx, lz, rot=0)=>{
    const f = {id:++state.seq.furn, key, lx, lz, rot};
    if(clampFurn(b, f)) b.furniture.push(f);
  };
  switch(b.type){
    case 'bedroom':
      if(office){ put('desk',0,-1.06); put('chair',0,-0.3,2); put('plant',1.4,1.1); }
      else { put('bed',-0.5,-0.36); put('nightstand',0.55,-1.2); put('wardrobe',0.4,1.06); put('plant',1.5,-1.1); }
      break;
    case 'hall':
      if(office){ put('desk',-0.9,-0.4); put('chair',-0.9,0.4,2); put('desk',0.9,-0.4); put('chair',0.9,0.4,2); put('plant',2.0,-1.3); }
      else {
        put('sofa',-0.4,-1.21); put('coffee',-0.4,-0.2); put('tv',-0.4,1.46); put('plant',2.0,-1.3);
        put('table',1.5,0.6); put('chair',1.5,-0.1,0); put('chair',1.5,1.3,2); put('chair',0.85,0.6,1); put('chair',2.15,0.6,3);
      }
      break;
    case 'kitchen':
      put('kunit',0,-0.76); put('fridge',1.01,0.71);
      if(!office) put('kunit',-1.06,0,1);
      break;
    case 'bath':
      put('toilet',-0.7,-0.435); put('basin',0.6,-0.56);
      if(!office) put('shower',0.61,0.31);
      break;
    case 'hallway':
      put('plant',-1.4,0.2); put('walllamp',1.5,0.3);
      break;
    case 'veranda':
      put('coffee',0,0); put('chair',-0.7,0,1); put('chair',0.7,0,3); put('plant',1.4,-0.7);
      break;
    case 'balcony':
      put('chair',0.5,0,3); put('plant',-1.1,0);
      break;
  }
}

// Paid templates (12 office + 8 other) are deliberately NOT defined here.
// builder.html is a public static file, so anything inline is free to anyone —
// their geometry is the product. Metadata comes from /api/templates; geometry
// from /api/templates/<key>, which 402s unless a template_unlock purchase exists
// (currently disabled — all templates free).
const PAID_TEMPLATES = new Map(); // key -> {name, cat, desc, owned}
let templateCatalogLoaded = false;

async function loadTemplateCatalog(){
  try{
    const res = await fetch('/api/templates', {credentials:'same-origin'});
    if(!res.ok) return false;
    const data = await res.json();
    // [PAYWALL DISABLED — free for now] Ownership list ignored: every paid
    // template is marked owned so the picker unlocks all 20.
    // const ownedSet = new Set(data.owned || []);
    PAID_TEMPLATES.clear();
    (data.templates || []).forEach(t=>{
      // [PAYWALL DISABLED — free for now]
      // if(t.paid) PAID_TEMPLATES.set(t.key, {name:t.name, cat:t.cat, desc:t.desc, owned:ownedSet.has(t.key)});
      if(t.paid) PAID_TEMPLATES.set(t.key, {name:t.name, cat:t.cat, desc:t.desc, owned:true});
    });
    templateCatalogLoaded = true;
    return true;
  }catch(e){ return false; }
}

// Geometry for an owned paid template. Returns {profile, rooms} or null.
async function fetchPaidGeometry(key){
  try{
    const res = await fetch('/api/templates/'+encodeURIComponent(key), {credentials:'same-origin'});
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
addTemplate('empty', 'Empty — single hall', 'other', 'Start from a single blank room', []);
TEMPLATES.empty.build = ()=>state.blocks.push(firstRoom());

// Only the free templates are defined inline now, so the assert covers those.
// Paid ones are validated server-side against lib/template-catalog.ts.
function assertTemplateCatalog(){
  const counts = {indian:0, office:0, other:0};
  Object.entries(TEMPLATES).forEach(([key, template])=>{
    if(!template.name || !template.cat || typeof template.build !== 'function') throw new Error('Invalid template '+key);
    if(key !== 'empty') counts[template.cat]++;
  });
  if(counts.indian !== 10 || counts.office !== 0 || counts.other !== 0) throw new Error('Template catalog count mismatch');
  return true;
}
assertTemplateCatalog();

const TEMPLATE_PRICE = '₹99';
let activeTplCat = 'indian';

function tplCard(key, entry, opts){
  const locked = opts && opts.locked;
  return '<button class="tpl-card'+(key === 'empty' ? ' ghost' : '')+(locked ? ' locked' : '')+'" '+
    'data-tpl="'+key+'"'+(locked ? ' data-tpl-locked="1"' : '')+'>'+
    '<span class="nm">'+entry.name+(locked ? ' <span class="tpl-lock">🔒 '+TEMPLATE_PRICE+'</span>' : '')+'</span>'+
    '<span class="desc">'+entry.desc+'</span></button>';
}

function renderTplList(cat){
  // free templates that live in this file
  const free = Object.entries(TEMPLATES)
    .filter(([key, t])=>key === 'empty' || t.cat === cat)
    .map(([key, t])=>tplCard(key, t, {locked:false}));
  // paid templates from the catalog; locked until purchased
  const paid = [...PAID_TEMPLATES.entries()]
    .filter(([, t])=>t.cat === cat)
    .map(([key, t])=>tplCard(key, t, {locked: !t.owned}));
  const cards = cat === 'indian' ? free.concat(paid) : paid.concat(free);
  if(!cards.length) return '<p class="hint">Could not load templates. Check your connection and reopen.</p>';
  return cards.join('');
}

function tplCatCount(cat){
  const free = Object.values(TEMPLATES).filter(t=>t.cat === cat).length - (cat === 'other' ? 1 : 0);
  const paid = [...PAID_TEMPLATES.values()].filter(t=>t.cat === cat).length;
  return free + paid;
}

function renderTplModal(){
  return '<div class="tpl-modal"><h3>New project</h3>'+
    '<p class="hint">Start from a layout template or begin with an empty room. '+
    // [PAYWALL DISABLED — free for now]
    // 'Indian house layouts are free; office and speciality layouts are '+TEMPLATE_PRICE+' each, unlocked forever.'+
    'All layout templates are free — pick one and start building.</p>'+
    '<div class="tpl-tabs">'+
      '<button type="button" class="tpl-tab'+(activeTplCat==='indian'?' active':'')+'" data-tpl-cat="indian">Indian Houses ('+tplCatCount('indian')+')</button>'+
      '<button type="button" class="tpl-tab'+(activeTplCat==='office'?' active':'')+'" data-tpl-cat="office">Offices ('+tplCatCount('office')+')</button>'+
      '<button type="button" class="tpl-tab'+(activeTplCat==='other'?' active':'')+'" data-tpl-cat="other">Other Layouts ('+tplCatCount('other')+')</button>'+
    '</div>'+
    '<div class="tpl-grid" id="tplGrid">'+renderTplList(activeTplCat)+'</div></div>';
}

async function showTemplatePicker(){
  activeTplCat = 'indian';
  showModal(renderTplModal());
  // catalog is cheap and reflects purchases made since load, so refresh each open
  if(await loadTemplateCatalog()) showModal(renderTplModal());
}

// Parent (DesignerOverlay) tells us a template purchase completed.
function markTemplateOwned(key){
  const entry = PAID_TEMPLATES.get(key);
  if(entry) entry.owned = true;
}
modal.addEventListener('click', e=>{
  const tab = e.target.closest('[data-tpl-cat]');
  if(tab){
    activeTplCat = tab.dataset.tplCat;
    modal.querySelectorAll('.tpl-tab').forEach(button=>button.classList.toggle('active', button === tab));
    const grid = modal.querySelector('#tplGrid');
    if(grid) grid.innerHTML = renderTplList(activeTplCat);
    return;
  }
  const template = e.target.closest('[data-tpl]');
  if(!template) return;
  const key = template.dataset.tpl;

  // Locked: hand off to the parent app, which owns Razorpay checkout. We never
  // see the geometry until the server agrees a purchase exists.
  if(template.dataset.tplLocked){
    const entry = PAID_TEMPLATES.get(key);
    parent.postMessage({type:'archit:buy-template', payload:{key, name: entry ? entry.name : key}}, location.origin);
    return;
  }

  hideModal();
  newProject(key);
});

/* ============================== share link ============================== */
async function packState(){
  const raw = new TextEncoder().encode(JSON.stringify({v:3, state}));
  let bytes = raw, mode = 'p';
  if(window.CompressionStream){
    const buf = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();
    bytes = new Uint8Array(buf); mode = 'g';
  }
  let bin = ''; bytes.forEach(x=>bin += String.fromCharCode(x));
  return mode + btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function unpackState(h){
  const mode = h[0];
  const bin = atob(h.slice(1).replace(/-/g,'+').replace(/_/g,'/'));
  let bytes = new Uint8Array([...bin].map(c=>c.charCodeAt(0)));
  if(mode==='g'){
    const buf = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    bytes = new Uint8Array(buf);
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function shareLink(){
  const url = location.origin + location.pathname + '#d=' + await packState();
  try{
    await navigator.clipboard.writeText(url);
    toast('Share link copied to clipboard');
  }catch(e){
    showModal(`<h3>Share link</h3>
      <input class="inp" value="${url.replace(/"/g,'&quot;')}" onclick="this.select()" readonly>
      <button class="mbtn" data-close>Done</button>`);
  }
}
async function tryHashLoad(){
  if(!location.hash.startsWith('#d=')) return false;
  try{
    const o = await unpackState(location.hash.slice(3));
    if(o && o.v===3 && o.state && Array.isArray(o.state.blocks)){
      state = o.state; linkFloor();
      history.replaceState(null, '', location.pathname);
      return true;
    }
  }catch(e){}
  return false;
}

/* ============================== boot ============================== */
// Builds a paid template's rooms from server-supplied geometry, using the same
// tRoom() renderer the inline free templates use.
function buildFromGeometry(geometry){
  const prof = geometry.profile || 'home';
  // v2 payloads (contract §1) carry object RoomSpecs; v1 carries [type,cx,cz,opts]
  // tuples. A rooms array may mix both forms.
  (geometry.rooms || []).forEach(room=>{
    if(Array.isArray(room)) tRoom(prof, ...room);
    else if(room && typeof room === 'object') tRoomSpec(prof, room);
  });
}

async function newProject(tpl='empty'){
  state = freshState();
  if(TEMPLATES[tpl]){
    TEMPLATES[tpl].build();
  }else if(PAID_TEMPLATES.has(tpl)){
    // owned paid template: geometry only exists server-side
    const geometry = await fetchPaidGeometry(tpl);
    if(geometry) buildFromGeometry(geometry);
    else { TEMPLATES.empty.build(); toast && toast('Could not load that template — starting from an empty room.'); }
  }else{
    TEMPLATES.empty.build();
  }
  undoStack = []; redoStack = []; sel = null;
  renderAll();
  let done = EMBED ? '1' : null;
  try{ done = done || localStorage.getItem('architTutDone') || localStorage.getItem('krausTutDone2'); }catch(e){}
  if(!done) setTimeout(startTutorial, 450);
}
// Local-dev only handle. Everything in this file is module-scoped, which makes the
// builder impossible to drive from a test harness or the devtools console.
if(location.hostname === 'localhost' || location.hostname === '127.0.0.1'){
  window.__archit = {
    get state(){ return state; }, get ui(){ return ui; }, get wallMats(){ return wallMats; },
    C, TEMPLATES, THREE, scene, blocksRoot, camera, controls, renderer,
    rebuild3D, renderAll, newProject, toggleRoofs, buildFromGeometry, tRoomSpec,
    buildRoofGroups, roofComponents, unionLoops, wallOpenings, wallNeighbors,
  };
}
resize();
(async ()=>{
  if(EMBED){
    newProject('empty');
    window.addEventListener('message', async e=>{
      if(e.origin !== location.origin) return;
      const m = e.data;
      // Parent finished Razorpay checkout for a template. The server is the
      // authority — we just re-read the catalog and open the bought template.
      if(m?.type === 'archit:template-purchased'){
        const key = m.payload && m.payload.key;
        if(!key) return;
        await loadTemplateCatalog();
        markTemplateOwned(key);
        hideModal();
        await newProject(key);
        toast('Template unlocked');
        return;
      }
      if(m?.type !== 'archit:init') return;
      const p = m.payload || {};
      if(p.design?.v === 3 && p.design.state){ state = p.design.state; linkFloor(); }
      else if(p.floors > 1){
        // pre-create the floors chosen in the setup dialog (new designs only)
        while(state.floors.length < Math.min(p.floors, 3)) state.floors.push({blocks:[]});
      }
      setContext(p.plot, p.neighbors, p.facing);
      undoStack = []; redoStack = []; sel = null; dirty = false;
      renderAll();
    });
    document.getElementById('saveMapB').addEventListener('click', ()=>{
      const all = (state.floors || [{blocks: state.blocks}]).flatMap(f=>f.blocks);
      if(!all.length){ toast('Add at least one room first'); return; }
      const bb = boundsOf(all);
      const R = Math.max(bb.w, bb.d) * 1.15 + 5;
      const snapshot = shoot3D([bb.cx + R*.85, R*.7, bb.cz + R*.85], [bb.cx, .6, bb.cz], false);
      parent.postMessage({type:'archit:save', payload:{design:{v:3, state}, snapshot}}, location.origin);
      dirty = false;
      toast('Saved');
    });
    document.getElementById('closeEmbedB').addEventListener('click', ()=>{
      parent.postMessage({type:'archit:close', dirty}, location.origin);
    });
    parent.postMessage({type:'archit:ready'}, location.origin);
  } else if(await tryHashLoad()){
    undoStack = []; redoStack = []; sel = null;
    renderAll();
    toast('Shared project loaded');
  } else if(loadProject()){
    undoStack = []; redoStack = []; sel = null;
    renderAll();
  } else {
    newProject();
    showTemplatePicker();
  }
  const loader = document.getElementById('loader');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    setTimeout(()=>{
      loader.classList.add('done');
      loader.addEventListener('transitionend', ()=>loader.remove(), {once:true});
    }, 500);
  }));
})();
