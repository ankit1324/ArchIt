# Dependabot alerts and security updates are enabled on the repo itself; this
# file only adds the scheduled *version* updates, which are off by default.
#
# Single maintainer, so the tuning goal is "a small pile of PRs once a week"
# rather than "every bump the moment it lands". Minor and patch updates are
# grouped into one PR per ecosystem; majors stay ungrouped, because those are
# the ones that need to be read rather than merged.
#
# main requires a pull request and a passing build-and-test check, so these PRs
# go through .github/workflows/ci.yml like any other — type check, lint, tests,
# and a production build. A green Dependabot PR is a tested one.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    # Enough room for the grouped PR plus a couple of majors. Anything beyond
    # that would just be a queue nobody reads.
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Kolkata
    # Two workflows pinning a handful of actions — weekly would be noise.
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"
    commit-message:
      prefix: ci
      include: scope
