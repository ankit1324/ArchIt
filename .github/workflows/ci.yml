name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: CI only reads the repo. Nothing here needs write access.
permissions:
  contents: read

# A new push supersedes the run it interrupted; don't burn minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # .nvmrc keeps CI on the same Node as local dev. The .mjs tests import
      # .ts modules directly, which needs Node's native type stripping (22.18+).
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Paid-template geometry against the builder engine's own rules
      # (scripts/check-templates.mjs, scripts/audit-template-issues.mjs).
      - name: Template checks
        run: npm run check:templates

      # Placeholder values only. next build evaluates route modules to collect
      # page data, so anything constructed at module scope runs during the build:
      # lib/csp.ts reads the YouPI origins at module scope for the builder CSP
      # carve-out in next.config.ts, and Clerk wants a publishable key it can parse. lib/db.ts no longer needs this — its client
      # is lazy now — but the Supabase entries stay so a future module-scope
      # regression fails on its own merits rather than on missing config.
      # Nothing here authenticates against anything; no request is made during a
      # build. Real secrets live in Vercel.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          YOUPI_API_URL: https://pay.placeholder.test
          NEXT_PUBLIC_YOUPI_PORTAL_URL: https://pay.placeholder.test
          YOUPI_WEBHOOK_SECRET: ci_placeholder
